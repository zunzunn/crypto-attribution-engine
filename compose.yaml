name: crypto-attribution-engine

services:
  # Local PostgreSQL for the backend. If you already run Postgres via
  # Homebrew/Postgres.app, you can skip this service and use DATABASE_URL
  # pointing at the existing instance instead.
  postgres:
    image: postgres:16-alpine
    container_name: crypto-attribution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
      POSTGRES_DB: crypto_attribution
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./v1/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d crypto_attribution"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
