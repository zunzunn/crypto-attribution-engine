name: Frontend CI

on:
  push:
    branches: [ feature/frontend, develop ]
    paths:
      - 'v2/frontend/**'
  pull_request:
    branches: [ feature/frontend, develop, main ]
    paths:
      - 'v2/frontend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: v2/frontend/package-lock.json

      - name: Install dependencies
        working-directory: v2/frontend
        run: npm ci

      - name: Build frontend production bundle
        working-directory: v2/frontend
        run: npm run build
